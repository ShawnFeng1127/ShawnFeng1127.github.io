<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>360° 球幕摄影空间 — 冯靖翔 (Shawn Feng)</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="projects detail style.css">
  <style>
    :root {
      --bg-dark: #07090D;
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.62);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      touch-action: none;
    }

    /* 1. Ambient Light, Volumetric Beams & Starlight Dust Background Canvas */
    #dome-bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Soft ambient light vignette & subtle dome glow */
    .dome-ambient-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 60% at 50% 35%, rgba(220, 235, 255, 0.08) 0%, rgba(175, 205, 255, 0.03) 52%, transparent 80%),
        radial-gradient(ellipse 55% 45% at 20% 75%, rgba(255, 235, 215, 0.045) 0%, transparent 70%),
        radial-gradient(ellipse 55% 45% at 80% 70%, rgba(200, 225, 255, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 50% 50%, transparent 48%, rgba(4, 5, 8, 0.58) 100%);
    }

    /* 2. Interactive 3D Spherical Viewport */
    .dome-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      overflow: hidden;
      cursor: grab;
      perspective: 850px;
      perspective-origin: 50% 50%;
    }

    .dome-viewport.is-dragging {
      cursor: grabbing !important;
    }

    .dome-scene-3d {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* Optional Third-Person Central Creator Figure */
    .dome-center-person {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 260px;
      height: 360px;
      transform-style: preserve-3d;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .dome-center-person img {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 18px 42px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 36px rgba(215, 232, 255, 0.22));
    }

    /* 3. Photo Panels Pasted on Inner Dome Wall (Bright, Directly Visible While Browsing) */
    .dome-photo-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 310px;
      height: 210px;
      border-radius: 14px;
      overflow: hidden;
      background: #10131A;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.65),
        0 0 42px rgba(215, 232, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      pointer-events: auto;
      cursor: pointer;
      transform-origin: center center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      outline: none;
    }

    .dome-photo-card:hover,
    .dome-photo-card:focus-visible {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 0 56px rgba(255, 255, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .dome-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dome-photo-card:hover .dome-photo-img {
      transform: scale(1.05);
    }

    /* Subtle bottom-only gradient so the photograph itself stays bright and clear */
    .dome-photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.0) 0%,
        rgba(0, 0, 0, 0.0) 58%,
        rgba(0, 0, 0, 0.72) 100%
      );
      pointer-events: none;
    }

    .dome-photo-bottom {
      position: absolute;
      bottom: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .dome-photo-info {
      min-width: 0;
      flex: 1;
    }

    .dome-photo-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    .dome-photo-loc {
      font-family: 'SF Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dome-photo-inspect {
      font-family: 'SF Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #08090C;
      background: rgba(255, 255, 255, 0.92);
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateY(3px);
      transition: all 0.22s ease;
    }

    .dome-photo-card:hover .dome-photo-inspect {
      opacity: 1;
      transform: translateY(0);
    }

    /* Portal Suction / Dive-In States ("照片把人吸进去") */
    .dome-photo-card.is-suction-target {
      border-color: rgba(255, 255, 255, 1) !important;
      box-shadow:
        0 0 80px rgba(215, 236, 255, 0.78),
        0 0 160px rgba(185, 220, 255, 0.45),
        inset 0 0 28px rgba(255, 255, 255, 0.55) !important;
    }

    .dome-photo-card.is-suction-target .dome-photo-bottom,
    .dome-photo-card.is-suction-target .dome-photo-overlay {
      opacity: 0 !important;
      transition: opacity 0.22s ease !important;
    }

    .dome-photo-card.is-suction-Target-img,
    .dome-photo-card.is-suction-target .dome-photo-img {
      transform: scale(1.12) !important;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    .dome-photo-card.is-suction-peripheral {
      filter: blur(2.5px) brightness(0.55);
      transition: filter 0.35s ease;
    }

    /* Fullscreen Optical Portal Suction Tunnel Overlay */
    .dome-portal-tunnel {
      position: fixed;
      inset: 0;
      z-index: 22;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(235, 245, 255, 0.35) 0%, rgba(190, 220, 255, 0.12) 26%, rgba(4, 6, 10, 0.82) 72%, rgba(2, 3, 6, 0.96) 100%);
      transition: opacity 0.18s linear;
    }

    .dome-hud-header,
    .dome-hud-bottom {
      transition: opacity 0.38s ease, transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.is-portal-sucking .dome-hud-header,
    body.is-portal-sucking .dome-hud-bottom {
      opacity: 0.12;
      transform: scale(0.96);
    }

    /* Smooth Portal Emergence on Lightbox Content */
    #project-lightbox .lightbox-content {
      transform: scale(0.92);
      opacity: 0;
      transition: transform 0.46s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.36s ease;
    }

    #project-lightbox.is-active .lightbox-content {
      transform: scale(1);
      opacity: 1;
    }

    /* 4. Top Floating Controls (Top Title Removed per User Request) */
    .dome-hud-header {
      position: fixed;
      top: 22px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .dome-hud-header > * {
      pointer-events: auto;
    }

    .dome-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 9999px;
      background: rgba(14, 17, 23, 0.65);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.04em;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .dome-back-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.38);
      transform: translateX(-2px);
    }

    .dome-hud-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dome-hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(14, 17, 23, 0.65);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      font-family: 'SF Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .dome-hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .dome-hud-btn.is-active {
      background: rgba(255, 255, 255, 0.92);
      color: #07080A;
      border-color: #FFFFFF;
    }

    /* 5. Bottom Telemetry & Hint HUD */
    .dome-hud-bottom {
      position: fixed;
      bottom: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 30;
      pointer-events: none;
    }

    .dome-telemetry-badge {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(14, 17, 22, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      pointer-events: auto;
    }

    .dome-telemetry-row {
      display: flex;
      gap: 14px;
    }

    .telemetry-val {
      color: #FFFFFF;
      font-weight: 600;
    }

    .dome-hint-box {
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(14, 17, 22, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      font-family: 'SF Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    /* First-Person Center Sight Reticle */
    .dome-crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 15;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      opacity: 0.65;
    }

    .dome-crosshair::before,
    .dome-crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 1px;
    }

    .dome-crosshair::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      transform: translateY(-50%);
    }

    .dome-crosshair::after {
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      transform: translateX(-50%);
    }

    .dome-crosshair-ring {
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .dome-crosshair.is-hovering {
      transform: translate(-50%, -50%) scale(1.55);
      opacity: 1;
    }

    .dome-crosshair.is-hovering .dome-crosshair-ring {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 768px) {
      .dome-hud-header {
        top: 14px;
        left: 14px;
        right: 14px;
      }
      .dome-photo-card {
        width: 220px;
        height: 150px;
      }
      .dome-hud-bottom {
        left: 14px;
        right: 14px;
        bottom: 14px;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }
      .dome-telemetry-badge, .dome-hint-box {
        width: 100%;
        justify-content: center;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <!-- 1. Dynamic Spherical Ambient Light & Starlight Dust Canvas -->
  <canvas id="dome-bg-canvas" aria-hidden="true"></canvas>
  <div class="dome-ambient-vignette" aria-hidden="true"></div>
  <div class="dome-portal-tunnel" id="dome-portal-tunnel" aria-hidden="true"></div>

  <!-- 2. First-Person Center Crosshair -->
  <div class="dome-crosshair" id="dome-crosshair" aria-hidden="true">
    <div class="dome-crosshair-ring"></div>
  </div>

  <!-- 3. Top Floating Controls (Top Header Title Deleted per User Request) -->
  <header class="dome-hud-header">
    <a href="index.html#section-work" class="dome-back-btn" title="退出球幕，返回主站摄影板块">
      <span>← BACK // 返回摄影</span>
    </a>

    <div class="dome-hud-tools">
      <button type="button" class="dome-hud-btn" id="btn-toggle-view" title="切换第一人称球幕 / 第三人称中心人物视角">
        <span id="view-mode-icon">👁</span>
        <span id="view-mode-text">第一人称球幕</span>
      </button>
      <button type="button" class="dome-hud-btn" id="btn-toggle-auto" title="暂停/开启自动环顾四周">
        <span id="auto-mode-icon">⏸</span>
        <span id="auto-mode-text">自动环顾</span>
      </button>
      <button type="button" class="dome-hud-btn" id="btn-reset-orientation" title="复位水平初始视角">
        <span>↺ 复位</span>
      </button>
    </div>
  </header>

  <!-- 4. Bottom Telemetry HUD -->
  <footer class="dome-hud-bottom">
    <div class="dome-telemetry-badge">
      <div class="dome-telemetry-row">
        <span>YAW (水平): <strong class="telemetry-val" id="telemetry-yaw">0.0°</strong></span>

      <div class="dome-telemetry-row">
        <span>FOV 视场角: <strong class="telemetry-val" id="telemetry-fov">70°</strong></span>

      </div>
    </div>

    <div class="dome-hint-box">
      <span>✥ 按住拖拽“转头环顾四周” · 滚轮推拉镜头 FOV · 点击照片平滑转向并打开详情</span>
    </div>
  </footer>

  <!-- 5. 3D Spherical Dome Stage (Photos Directly Visible on Inner Dome Wall) -->
  <div class="dome-viewport" id="dome-viewport" role="region" aria-label="360度第一人称球幕摄影空间">
    <div class="dome-scene-3d" id="dome-scene-3d">
      <!-- Optional Third-Person Creator Figure -->
      <div class="dome-center-person" id="dome-center-person" aria-hidden="true">
        <img src="Project pictures/home page人物.png" alt="Shawn Feng">
      </div>
      <!-- Photo Panels Injected Here -->
    </div>
  </div>

  <!-- 6. Exact Original Photo Detail Lightbox (#project-lightbox - 100% Unchanged Format) -->
  <div id="project-lightbox" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="lightbox-content is-horizontal" id="lightbox-content">
      <div class="lightbox-img-wrap">
        <img class="lightbox-img" src="" alt="Expanded Photography View">
      </div>
      <div class="lightbox-details">
        <div class="lightbox-meta-header">
          <div class="lightbox-header-left">
            <span class="lightbox-series-tag" id="lightbox-series-tag">SERIES 01 / HORIZONTAL</span>
            <div class="lightbox-dual-switcher" id="lightbox-dual-switcher" hidden>
              <button type="button" class="lightbox-variant-btn" data-target-variant="a" id="lightbox-variant-a">A</button>
              <button type="button" class="lightbox-variant-btn" data-target-variant="b" id="lightbox-variant-b">B</button>
            </div>
          </div>
          <div class="lightbox-header-right">
            <span class="lightbox-wheel-pill">↕ 滚轮阅读简介</span>
            <span class="lightbox-location-meta" id="lightbox-location-meta">SHAWN FENG PHOTOGRAPHY</span>
            <div class="lightbox-controls">
              <button class="lightbox-btn lightbox-prev" type="button" aria-label="上一张作品" title="上一张 (←)">←</button>
              <button class="lightbox-btn lightbox-next" type="button" aria-label="下一张作品" title="下一张 (→)">→</button>
              <button class="lightbox-btn lightbox-close" type="button" aria-label="关闭大图" title="关闭 (Esc)">&times;</button>
            </div>
          </div>
        </div>

        <div class="lightbox-bio-scroll" id="lightbox-bio-scroll" tabindex="0" aria-label="作品中英文详情（滚轮可上下滚动查看）">
          <h3 class="lightbox-title"></h3>
          <p class="lightbox-subtitle"></p>
          <div class="lightbox-divider"></div>
          <p class="lightbox-bio lightbox-bio-cn" id="lightbox-bio"></p>
          <p class="lightbox-bio lightbox-bio-en" id="lightbox-bio-en"></p>
        </div>
      </div>
    </div>
  </div>

    let steerTargetYaw = 0, steerTargetPitch = 0;

    function getSphereRadius() {
      const w = window.innerWidth;
      if (w < 600) return 520;
      if (w < 960) return 650;
      return 740;
    }

    // --- 1. Build 18 Spherical Inner-Wall Panels ---
    // Balanced Fibonacci Sphere distribution so 4~5 large, vivid photos are always in view
    const TOTAL_PANELS = 18;
    const panelNodes = [];

    function buildDomePanels() {
      const phi = Math.PI * (Math.sqrt(5) - 1); // golden angle ~2.39996 rad

      for (let i = 0; i < TOTAL_PANELS; i++) {
        const item = PHOTO_CATALOG[i % PHOTO_CATALOG.length];

        // Distribute y in [-0.70, +0.70] so panels wrap around the horizon & upper/lower vaults
        const t = i / (TOTAL_PANELS - 1);
        const y = (1 - 2 * t) * 0.70;
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = phi * i;

        const ux = Math.cos(theta) * radiusAtY;
        const uy = y;
        const uz = -Math.sin(theta) * radiusAtY;

        const card = document.createElement('article');
        card.className = 'dome-photo-card';
        card.setAttribute('data-photo-id', item.id);
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${item.shortTag}: ${item.title}`);

        card.innerHTML = `
          <img class="dome-photo-img" src="${item.src}" alt="${item.title}">
          <div class="dome-photo-overlay"></div>
          <div class="dome-photo-bottom">
            <div class="dome-photo-info">
              <h3 class="dome-photo-title">${item.title}</h3>
              <p class="dome-photo-loc">${item.location}</p>
            </div>
            <span class="dome-photo-inspect">查看详情 ↗</span>
          </div>
        `;

        card.addEventListener('pointerenter', () => {
          crosshair.classList.add('is-hovering');
        });
        card.addEventListener('pointerleave', () => {
          crosshair.classList.remove('is-hovering');
        });

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          if (totalDragDist > 7) return;
          steerAndOpenPhoto(i, ux, uy, uz, item.id);
        });

        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            steerAndOpenPhoto(i, ux, uy, uz, item.id);
          }
        });

        scene3d.appendChild(card);
        panelNodes.push({
          el: card,
          item,
          ux,
          uy,
          uz
        });
      }
    }

    // --- 2. Gravitational Portal Suction ("照片把人吸进去") & Open Original Lightbox ---
    function steerAndOpenPhoto(panelIndex, ux, uy, uz, photoId) {
      if (isSteering) return;
      isSteering = true;
      isReleasing = false;
      steerPanelIndex = panelIndex;
      steerBaseFov = fov;
      steerProgress = 0;
      suctionStrength = 0;
      steerPhotoId = photoId;
      steerStartYaw = yaw;
      steerStartPitch = pitch;
      velYaw = 0;
      velPitch = 0;

      steerTargetYaw = Math.atan2(ux, -uz);
      steerTargetPitch = Math.asin(Math.max(-1, Math.min(1, uy)));

      let deltaYaw = (steerTargetYaw - steerStartYaw) % (Math.PI * 2);
      if (deltaYaw > Math.PI) deltaYaw -= Math.PI * 2;
      if (deltaYaw < -Math.PI) deltaYaw += Math.PI * 2;
      steerTargetYaw = steerStartYaw + deltaYaw;

      document.body.classList.add('is-portal-sucking');
      panelNodes.forEach((node, idx) => {
        node.el.classList.toggle('is-suction-target', idx === panelIndex);
        node.el.classList.toggle('is-suction-peripheral', idx !== panelIndex);
      });
    }

    function startPortalRelease() {
      isSteering = false;
      isReleasing = true;
      document.body.classList.remove('is-portal-sucking');
      panelNodes.forEach((node) => {
        node.el.classList.remove('is-suction-target', 'is-suction-peripheral');
      });
    }

    // --- 3. Ambient Light Effects, Volumetric Rays & Starlight Background Renderer ---
    const AMBIENT_NEBULAE = [
      { ux: 0.0, uy: 0.12, uz: -1.0, radius: 640, color: '215, 232, 255', alpha: 0.17 },
      { ux: 0.82, uy: -0.08, uz: -0.55, radius: 580, color: '255, 228, 200', alpha: 0.13 },

      { ux: -0.5, uy: -0.48, uz: 0.72, radius: 580, color: '205, 238, 248', alpha: 0.12 },

    const LIGHT_MOTES = Array.from({ length: 95 }, (_, i) => {
      const phi = Math.PI * (Math.sqrt(5) - 1);
      const y = 1 - (i / 94) * 2;

      return {

      return {
        angle,
        cos: Math.cos(angle),
        sin: Math.sin(angle),
        offset: (i * 0.19) % 1,
        speed: 1.4 + (i % 5) * 0.35,
        length: 65 + (i % 4) * 35,
        width: 1.1 + (i % 3) * 0.65

      bgCanvas.width = window.innerWidth * dpr;

    function projectUnitVectorToScreen(ux, uy, uz, cosYaw, sinYaw, cosPitch, sinPitch, focalLength, cx, cy) {
      const x1 = ux * cosYaw + uz * sinYaw;
      const z1 = -ux * sinYaw + uz * cosYaw;
      const yc = uy * cosPitch + z1 * sinPitch;
      const zc = -uy * sinPitch + z1 * cosPitch;
      const xc = x1;

      if (zc >= -0.05) return null;
      const scale = focalLength / -zc;
      return {
        x: cx + xc * scale,
        y: cy - yc * scale,
        zc
      };
    }

    function renderAmbientLightBackground(now, cosYaw, sinYaw, cosPitch, sinPitch, focalLength) {

      const h = window.innerHeight;

      const cy = h * 0.5;

      bgCtx.clearRect(0, 0, w, h);

      // 1. Soft atmospheric center & zenith light wash
      const centerGrad = bgCtx.createRadialGradient(cx, cy * 0.85, 10, cx, cy, Math.max(w, h) * 0.72);
      centerGrad.addColorStop(0, 'rgba(38, 46, 62, 0.48)');
      centerGrad.addColorStop(0.45, 'rgba(18, 22, 32, 0.28)');
      centerGrad.addColorStop(1, 'rgba(7, 9, 13, 0)');
      bgCtx.fillStyle = centerGrad;
      bgCtx.fillRect(0, 0, w, h);

      bgCtx.save();
      const beamShift = Math.sin(yaw * 0.6 + now * 0.0004) * 120;
      const beamGrad = bgCtx.createLinearGradient(cx - 380 + beamShift, 0, cx + 380 + beamShift, h);
      beamGrad.addColorStop(0, 'rgba(220, 235, 255, 0)');
      beamGrad.addColorStop(0.35, 'rgba(220, 235, 255, 0.032)');
      beamGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.055)');
      beamGrad.addColorStop(0.65, 'rgba(210, 228, 255, 0.032)');
      beamGrad.addColorStop(1, 'rgba(210, 228, 255, 0)');
      bgCtx.fillStyle = beamGrad;
      bgCtx.fillRect(0, 0, w, h);

      const pulse = 0.92 + 0.08 * Math.sin(now * 0.0012);
      AMBIENT_NEBULAE.forEach((neb) => {

        if (!pt) return;
        const r = neb.radius * (focalLength / 820);
        const grad = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r);
        grad.addColorStop(0, `rgba(${neb.color}, ${(neb.alpha * pulse).toFixed(3)})`);
        grad.addColorStop(0.45, `rgba(${neb.color}, ${(neb.alpha * 0.48 * pulse).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${neb.color}, 0)`);
        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        bgCtx.fill();
      });

      // 4. Geodesic Dome Latitude & Longitude Light Rings
      const latAngles = [-0.52, -0.26, 0, 0.26, 0.52];
      latAngles.forEach((lat, idx) => {
        const uy = Math.sin(lat);
        const rLat = Math.cos(lat);
        bgCtx.beginPath();
        let started = false;
        for (let step = 0; step <= 72; step++) {
          const lon = (step / 72) * Math.PI * 2;
          const ux = Math.cos(lon) * rLat;
          const uz = Math.sin(lon) * rLat;
          const pt = projectUnitVectorToScreen(ux, uy, uz, cosYaw, sinYaw, cosPitch, sinPitch, focalLength, cx, cy);
          if (pt && pt.x >= -200 && pt.x <= w + 200 && pt.y >= -200 && pt.y <= h + 200) {
            if (!started) {
              bgCtx.moveTo(pt.x, pt.y);
              started = true;
            } else {
              bgCtx.lineTo(pt.x, pt.y);
            }
          } else {
            started = false;
          }
        }
        bgCtx.strokeStyle = idx === 2 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(255, 255, 255, 0.04)';
        bgCtx.lineWidth = idx === 2 ? 1.2 : 0.8;
        bgCtx.stroke();
      });

      // 5. Floating Luminous Starlight & Bokeh Motes
      LIGHT_MOTES.forEach((m) => {
        const pt = projectUnitVectorToScreen(m.ux, m.uy, m.uz, cosYaw, sinYaw, cosPitch, sinPitch, focalLength, cx, cy);
        if (!pt || pt.x < -80 || pt.x > w + 80 || pt.y < -80 || pt.y > h + 80) return;

        const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(now * m.speed + m.phase));
        if (m.isBokeh) {
          const bokehR = m.size * 12;
          const bGrad = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, bokehR);
          bGrad.addColorStop(0, `rgba(235, 244, 255, ${(0.15 * twinkle).toFixed(3)})`);
          bGrad.addColorStop(0.5, `rgba(210, 228, 255, ${(0.06 * twinkle).toFixed(3)})`);
          bGrad.addColorStop(1, 'rgba(210, 228, 255, 0)');
          bgCtx.fillStyle = bGrad;
          bgCtx.beginPath();
          bgCtx.arc(pt.x, pt.y, bokehR, 0, Math.PI * 2);
          bgCtx.fill();
        } else {
          bgCtx.fillStyle = `rgba(255, 255, 255, ${(0.45 * twinkle).toFixed(3)})`;
          bgCtx.beginPath();
          bgCtx.arc(pt.x, pt.y, m.size, 0, Math.PI * 2);
          bgCtx.fill();
        }
      });

      // 6. Gravitational Portal Suction Vortex & Radial Light Streaks (Active when clicking a photo)
      if (suctionStrength > 0.008) {
        const maxDist = Math.hypot(cx, cy);
        bgCtx.save();

        // Concentric gravitational event-horizon rings rushing inward/outward
        for (let rIdx = 0; rIdx < 3; rIdx++) {
          const ringPhase = (1 - ((suctionStrength * 1.8 + rIdx * 0.33) % 1));
          const ringRadius = Math.max(12, ringPhase * maxDist * 0.72);
          const ringAlpha = Math.sin(ringPhase * Math.PI) * suctionStrength * 0.38;
          bgCtx.beginPath();
          bgCtx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
          bgCtx.strokeStyle = `rgba(215, 236, 255, ${ringAlpha.toFixed(3)})`;
          bgCtx.lineWidth = 1.5 + (1 - ringPhase) * 2.5;
          bgCtx.stroke();
        }

        // Radial warp-speed light streaks pulling viewer into the photo center
        SUCTION_STREAKS.forEach((st) => {
          const travel = (st.offset - suctionStrength * st.speed * 0.85 + 2) % 1;
          const innerR = 40 + travel * maxDist * 0.85;
          const streakLen = st.length * (0.4 + suctionStrength * 2.4);
          const outerR = innerR + streakLen;

          const x1 = cx + st.cos * innerR;
          const y1 = cy + st.sin * innerR;
          const x2 = cx + st.cos * outerR;
          const y2 = cy + st.sin * outerR;

          const grad = bgCtx.createLinearGradient(x1, y1, x2, y2);
          const alpha = Math.min(0.78, suctionStrength * 0.75 * Math.sin(travel * Math.PI));
          grad.addColorStop(0, `rgba(255, 255, 255, ${alpha.toFixed(3)})`);
          grad.addColorStop(0.5, `rgba(200, 228, 255, ${(alpha * 0.6).toFixed(3)})`);
          grad.addColorStop(1, 'rgba(180, 215, 255, 0)');

          bgCtx.beginPath();
          bgCtx.moveTo(x1, y1);
          bgCtx.lineTo(x2, y2);
          bgCtx.strokeStyle = grad;
          bgCtx.lineWidth = st.width;
          bgCtx.stroke();
        });

        bgCtx.restore();
      }
    }

    // --- 4. Main 3D Spherical Dome Render Loop ---
    function animate(now) {
      requestAnimationFrame(animate);

      // Handle Gravitational Portal Suction ("照片把人吸进去") or Release
      if (isSteering) {
        steerProgress += 0.023;
        const t = Math.min(1, steerProgress);

        // Stage 1: Rapid Magnetic Gaze Lock onto Clicked Photo (0 -> 0.45)
        const lockT = Math.min(1, t / 0.45);
        const easeLock = 1 - Math.pow(1 - lockT, 3);
        yaw = steerStartYaw + (steerTargetYaw - steerStartYaw) * easeLock;
        pitch = steerStartPitch + (steerTargetPitch - steerStartPitch) * easeLock;

        // Stage 2: Accelerating Gravitational Portal Pull (0.06 -> 1.0)
        const suctionT = Math.max(0, (t - 0.06) / 0.94);
        suctionStrength = Math.pow(suctionT, 2.15);

        // Stage 3: Optical Dolly-Zoom FOV Vertigo (slight inhale widen -> deep tunnel plunge)
        const intakePulse = Math.sin(Math.min(1, t / 0.35) * Math.PI) * 8.5;
        fov = Math.max(28, steerBaseFov + intakePulse - suctionStrength * (steerBaseFov - 30));
        telemetryFov.textContent = `${Math.round(fov)}°`;

        if (portalTunnelEl) {
          portalTunnelEl.style.opacity = (suctionStrength * 0.92).toFixed(3);
        }

        if (t >= 1) {
          isSteering = false;
          if (steerPhotoId && typeof window.openPhotoLightbox === 'function') {
            window.openPhotoLightbox(steerPhotoId);
          }
        }
      } else if (isReleasing) {
        // Smoothly emerge back into the dome center when closing the photo detail modal
        suctionStrength *= 0.82;
        fov += (steerBaseFov - fov) * 0.16;
        telemetryFov.textContent = `${Math.round(fov)}°`;

        if (portalTunnelEl) {
          portalTunnelEl.style.opacity = (suctionStrength * 0.85).toFixed(3);
        }

        if (suctionStrength < 0.008 && Math.abs(fov - steerBaseFov) < 0.3) {
          suctionStrength = 0;
          fov = steerBaseFov;
          telemetryFov.textContent = `${Math.round(fov)}°`;
          if (portalTunnelEl) portalTunnelEl.style.opacity = '0';
          isReleasing = false;
          steerPanelIndex = -1;
          lastUserActionTime = Date.now();
        }
      } else if (!isDragging) {
        if (Math.abs(velYaw) > 0.00008 || Math.abs(velPitch) > 0.00008) {
          yaw += velYaw;
          pitch = Math.max(-1.42, Math.min(1.42, pitch + velPitch));
          velYaw *= FRICTION;
          velPitch *= FRICTION;
        } else if (isAutoRotating && !document.getElementById('project-lightbox').classList.contains('is-active')) {
          if (Date.now() - lastUserActionTime > AUTO_RESUME_MS) {
            yaw += 0.0014;
          }
        }
      }

      const h = window.innerHeight;
      const fovRad = (fov * Math.PI) / 180;
      const focalLength = (h * 0.5) / Math.tan(fovRad * 0.5);
      viewport.style.perspective = `${focalLength.toFixed(1)}px`;

      const cosYaw = Math.cos(yaw);
      const sinYaw = Math.sin(yaw);
      const cosPitch = Math.cos(pitch);
      const sinPitch = Math.sin(pitch);

      // Render Ambient Light & Starlight Canvas
      renderAmbientLightBackground(now, cosYaw, sinYaw, cosPitch, sinPitch, focalLength);

      const R = getSphereRadius();

      if (currentViewMode === 'first-person') {
        centerPersonEl.style.display = 'none';

        for (let i = 0; i < panelNodes.length; i++) {
          const node = panelNodes[i];

          // Rotate world unit vector into Camera Space
          const x1 = node.ux * cosYaw + node.uz * sinYaw;
          const z1 = -node.ux * sinYaw + node.uz * cosYaw;
          const y1 = node.uy;

          const yc = y1 * cosPitch + z1 * sinPitch;
          const zc = -y1 * sinPitch + z1 * cosPitch;
          const xc = x1;

          // Cull panels behind the viewer's head (zc >= -0.14)
          if (zc >= -0.14) {
            node.el.style.display = 'none';
            continue;
          }

          node.el.style.display = 'block';

          const isTarget = i === steerPanelIndex && suctionStrength > 0.001;
          const effectiveR = isTarget
            ? R * (1 - suctionStrength * 0.84)
            : R * (1 + suctionStrength * 0.42);

          const Xcss = effectiveR * xc;
          const Ycss = -effectiveR * yc;
          const Zcss = focalLength + effectiveR * zc;

          // Inner-wall orientation facing the sphere center (lookAt origin)
          const panelYaw = Math.atan2(-xc, -zc);
          const panelPitch = -Math.asin(Math.max(-1, Math.min(1, yc)));

          const forwardness = Math.min(1, (-zc - 0.14) / 0.32);
          let opacity = 0.45 + 0.55 * forwardness;
          let portalScale = 1;

          if (suctionStrength > 0.001) {
            if (isTarget) {
              opacity = 1;
              portalScale = 1 + suctionStrength * 3.35;
            } else {
              opacity *= Math.max(0.04, 1 - suctionStrength * 0.94);
              portalScale = Math.max(0.72, 1 - suctionStrength * 0.22);
            }
          }

          node.el.style.opacity = opacity.toFixed(3);
          node.el.style.zIndex = isTarget ? 5000 : Math.round(1000 + zc * -500);
          node.el.style.transform = `translate3d(calc(-50% + ${Xcss.toFixed(1)}px), calc(-50% + ${Ycss.toFixed(1)}px), ${Zcss.toFixed(1)}px) rotateY(${panelYaw.toFixed(4)}rad) rotateX(${panelPitch.toFixed(4)}rad) scale(${portalScale.toFixed(3)})`;
        }
      } else {
        // Third-Person Mode
        const orbitDist = 1150;
        const Rtp = R * 0.62;
        const centerZ = focalLength - orbitDist;

        centerPersonEl.style.display = 'flex';
        centerPersonEl.style.zIndex = '1000';
        centerPersonEl.style.transform = `translate3d(-50%, -50%, ${centerZ.toFixed(1)}px)`;

        for (let i = 0; i < panelNodes.length; i++) {
          const node = panelNodes[i];
          if (i >= 12) {
            node.el.style.display = 'none';
            continue;
          }
          node.el.style.display = 'block';

          const x1 = node.ux * cosYaw + node.uz * sinYaw;
          const z1 = -node.ux * sinYaw + node.uz * cosYaw;
          const yc = node.uy * cosPitch + z1 * sinPitch;
          const zc = -node.uy * sinPitch + z1 * cosPitch;
          const xc = x1;

          const isTarget = i === steerPanelIndex && suctionStrength > 0.001;
          const Xcss = Rtp * xc * (isTarget ? (1 - suctionStrength * 0.85) : 1);
          const Ycss = -Rtp * yc * (isTarget ? (1 - suctionStrength * 0.85) : 1);
          const Zcss = isTarget
            ? (centerZ + Rtp * zc) + suctionStrength * 920
            : centerZ + Rtp * zc;
          const tpScale = isTarget ? (0.78 + suctionStrength * 2.8) : 0.78;

          node.el.style.opacity = isTarget ? '1' : (zc >= 0 ? '0.96' : '0.48');
          node.el.style.zIndex = isTarget ? 5000 : Math.round(1000 + zc * 400);
          node.el.style.transform = `translate3d(calc(-50% + ${Xcss.toFixed(1)}px), calc(-50% + ${Ycss.toFixed(1)}px), ${Zcss.toFixed(1)}px) scale(${tpScale.toFixed(3)})`;
        }
      }

      // Update Telemetry HUD
      const degYaw = (((yaw * 180 / Math.PI) % 360 + 360) % 360).toFixed(1);
      const degPitch = (pitch * 180 / Math.PI).toFixed(1);
      telemetryYaw.textContent = `${degYaw}°`;
      telemetryPitch.textContent = `${degPitch}°`;
    }

    // --- 5. Interaction Setup ---
    function setupDomeInteractions() {
      viewport.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        isDragging = true;
        totalDragDist = 0;
        prevX = e.clientX;
        prevY = e.clientY;
        velYaw = 0;
        velPitch = 0;
        isSteering = false;
        lastUserActionTime = Date.now();
        viewport.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        prevX = e.clientX;
        prevY = e.clientY;
        totalDragDist += Math.hypot(dx, dy);

        yaw -= dx * 0.0034;
        pitch = Math.max(-1.42, Math.min(1.42, pitch + dy * 0.0034));

        velYaw = -dx * 0.0028;
        velPitch = dy * 0.0028;
        lastUserActionTime = Date.now();
      });

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        viewport.classList.remove('is-dragging');
        lastUserActionTime = Date.now();
      }

      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);

      viewport.addEventListener('wheel', (e) => {
        if (document.getElementById('project-lightbox').classList.contains('is-active')) return;
        e.preventDefault();
        fov = Math.max(38, Math.min(85, fov + e.deltaY * 0.035));
        telemetryFov.textContent = `${Math.round(fov)}°`;
        lastUserActionTime = Date.now();
      }, { passive: false });

      let initPinchDist = 0;
      let initFov = 70;
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initFov = fov;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initPinchDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          fov = Math.max(38, Math.min(85, initFov * (initPinchDist / dist)));
          telemetryFov.textContent = `${Math.round(fov)}°`;
        }
      }, { passive: true });

      btnToggleView.addEventListener('click', () => {
        if (currentViewMode === 'first-person') {
          currentViewMode = 'third-person';
          viewModeText.textContent = '第三人称视点';
          telemetryMode.textContent = 'THIRD-PERSON ORBIT';
          btnToggleView.classList.add('is-active');
        } else {
          currentViewMode = 'first-person';
          viewModeText.textContent = '第一人称球幕';
          telemetryMode.textContent = 'FIRST-PERSON DOME';
          btnToggleView.classList.remove('is-active');
        }
      });

      btnToggleAuto.addEventListener('click', () => {
        isAutoRotating = !isAutoRotating;
        autoModeIcon.textContent = isAutoRotating ? '⏸' : '▶';
        btnToggleAuto.classList.toggle('is-active', !isAutoRotating);
      });

      btnReset.addEventListener('click', () => {
        yaw = 0;
        pitch = 0;
        velYaw = 0;
        velPitch = 0;
        fov = 70;
        telemetryFov.textContent = '70°';
      });

      window.addEventListener('resize', resizeBgCanvas);
    }

    // --- 6. Exact Original Lightbox Controller (#project-lightbox) ---
    function initOriginalLightbox() {
      const modal = document.getElementById('project-lightbox');
      const modalContent = document.getElementById('lightbox-content');
      const modalImg = modal.querySelector('.lightbox-img');
      const modalDetails = modal.querySelector('.lightbox-details');
      const modalTitle = modal.querySelector('.lightbox-title');
      const modalSubtitle = modal.querySelector('.lightbox-subtitle');
      const modalBio = document.getElementById('lightbox-bio');
      const modalBioEn = document.getElementById('lightbox-bio-en');
      const modalBioScroll = document.getElementById('lightbox-bio-scroll');
      const modalSeriesTag = document.getElementById('lightbox-series-tag');
      const modalLocationMeta = document.getElementById('lightbox-location-meta');
      const modalDualSwitcher = document.getElementById('lightbox-dual-switcher');
      const modalVariantBtnA = document.getElementById('lightbox-variant-a');
      const modalVariantBtnB = document.getElementById('lightbox-variant-b');
      const prevBtn = modal.querySelector('.lightbox-prev');
      const nextBtn = modal.querySelector('.lightbox-next');
      const closeBtn = modal.querySelector('.lightbox-close');
      const wheelHintPill = modal.querySelector('.lightbox-wheel-pill');

      let activePhotoIndex = 0;

      function syncModalDimensions() {
        const item = PHOTO_CATALOG[activePhotoIndex];
        if (!item || !modalImg || !modalDetails) return;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const ratio =
          modalImg.complete && modalImg.naturalWidth > 0 && modalImg.naturalHeight > 0
            ? modalImg.naturalWidth / modalImg.naturalHeight
            : item.ratio || 1.5;

        if (item.orientation === 'horizontal') {
          const gap = 10;
          const verticalPadding = 20;
          const bioHeight = Math.min(235, Math.max(188, Math.round(vh * 0.235)));
          const maxPhotoH = Math.max(320, Math.round(vh - bioHeight - gap - verticalPadding));
          const maxW = Math.min(1600, Math.round(vw * 0.96));
          const matchedWidth = Math.round(Math.min(maxW, maxPhotoH * ratio));

          modalImg.style.width = `${matchedWidth}px`;
          modalImg.style.height = 'auto';
          modalImg.style.maxWidth = 'none';
          modalImg.style.maxHeight = 'none';

          modalDetails.style.width = `${matchedWidth}px`;
          modalDetails.style.height = `${bioHeight}px`;

          requestAnimationFrame(() => {
            const renderedW = Math.round(modalImg.getBoundingClientRect().width);
            if (renderedW > 0) modalDetails.style.width = `${renderedW}px`;
          });
        } else {
          const gap = 14;
          const verticalPadding = 20;
          const bioWidth = Math.min(700, Math.max(400, Math.round(vw * 0.48)));
          const maxPhotoW = Math.max(320, Math.round(vw * 0.96 - bioWidth - gap));
          const maxH = Math.min(960, Math.round(vh - verticalPadding));
          const matchedHeight = Math.round(Math.min(maxH, maxPhotoW / ratio));

          modalImg.style.height = `${matchedHeight}px`;
          modalImg.style.width = 'auto';
          modalImg.style.maxWidth = 'none';
          modalImg.style.maxHeight = 'none';

          modalDetails.style.height = `${matchedHeight}px`;
          modalDetails.style.width = `${bioWidth}px`;

          requestAnimationFrame(() => {
            const renderedH = Math.round(modalImg.getBoundingClientRect().height);
            if (renderedH > 0) modalDetails.style.height = `${renderedH}px`;
          });
        }
      }

      modalImg.addEventListener('load', () => {
        modalImg.classList.remove('is-switching-photo');
        syncModalDimensions();
      });

      window.addEventListener('resize', () => {
        if (modal.classList.contains('is-active')) syncModalDimensions();
      });

      function renderModalByCatalogIndex(index) {
        activePhotoIndex = (index + PHOTO_CATALOG.length) % PHOTO_CATALOG.length;
        const item = PHOTO_CATALOG[activePhotoIndex];
        if (!item) return;

        modalContent.classList.toggle('is-vertical', item.orientation === 'vertical');
        modalContent.classList.toggle('is-horizontal', item.orientation !== 'vertical');

        if (modal.classList.contains('is-active') && modalImg.getAttribute('src') !== item.src) {
          modalImg.classList.add('is-switching-photo');
        }
        modalImg.src = item.src;
        modalImg.alt = item.title;

        modalTitle.textContent = item.title;
        modalSubtitle.textContent = item.subtitle;
        modalBio.textContent = item.bio;
        modalBioEn.textContent = item.bioEn || '';
        modalBioScroll.scrollTop = 0;
        if (wheelHintPill) wheelHintPill.classList.remove('is-scrolled');
        modalSeriesTag.textContent = item.tag;
        modalLocationMeta.textContent = item.location;

        if (item.series === '4' || item.series === '10') {
          modalDualSwitcher.hidden = false;
          const num = item.series.padStart(2, '0');
          modalVariantBtnA.textContent = item.series === '4' ? `${num}A · 中轴线` : `${num}A · 蓝调时刻`;
          modalVariantBtnB.textContent = item.series === '4' ? `${num}B · 永宁门` : `${num}B · 黄昏时刻`;
          modalVariantBtnA.classList.toggle('is-active', item.variant === 'a');
          modalVariantBtnB.classList.toggle('is-active', item.variant === 'b');
        } else {
          modalDualSwitcher.hidden = true;
        }

        syncModalDimensions();
      }

      function openLightboxByPhotoId(photoId) {
        const idx = PHOTO_CATALOG.findIndex((p) => p.id === photoId);
        renderModalByCatalogIndex(idx >= 0 ? idx : 0);
        modal.classList.add('is-active');
        modal.setAttribute('aria-hidden', 'false');
        modalBioScroll.focus({ preventScroll: true });
      }

      function closeLightbox() {
        modal.classList.remove('is-active');
        modal.setAttribute('aria-hidden', 'true');
        startPortalRelease();
      }

      window.openPhotoLightbox = openLightboxByPhotoId;
      window.openLightbox = (item) => openLightboxByPhotoId(item ? item.id : '1');
      window.closeLightbox = closeLightbox;

      modalVariantBtnA.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = PHOTO_CATALOG[activePhotoIndex];
        if (current && (current.series === '4' || current.series === '10')) {
          openLightboxByPhotoId(`${current.series}a`);
        }
      });

      modalVariantBtnB.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = PHOTO_CATALOG[activePhotoIndex];
        if (current && (current.series === '4' || current.series === '10')) {
          openLightboxByPhotoId(`${current.series}b`);
        }
      });

      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        renderModalByCatalogIndex(activePhotoIndex - 1);
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        renderModalByCatalogIndex(activePhotoIndex + 1);
      });

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeLightbox();
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeLightbox();
      });

      window.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('is-active')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') renderModalByCatalogIndex(activePhotoIndex - 1);
        else if (e.key === 'ArrowRight') renderModalByCatalogIndex(activePhotoIndex + 1);
      });

      window.addEventListener(
        'wheel',
        (e) => {
          if (!modal.classList.contains('is-active')) return;
          e.preventDefault();
          e.stopPropagation();
          let delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
          if (e.deltaMode === 1) delta *= 36;
          else if (e.deltaMode === 2) delta *= 360;
          modalBioScroll.scrollTop += delta;
        },
        { passive: false, capture: true }
      );
    }

    // --- Boot ---
    window.addEventListener('DOMContentLoaded', () => {
      resizeBgCanvas();
      buildDomePanels();
