<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>360° 第一人称球幕影院 — 冯靖翔 (Shawn Feng)</title>
  <!-- Three.js CDN with Local Fallback Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-dark: #07080A;
      --card-bg: rgba(18, 21, 28, 0.75);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.6);
      --accent: #E6EDF5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      color: var(--text-main);
      touch-action: none;
    }

    /* 3D WebGL / CSS3D Canvas Host */
    #dome-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #dome-canvas-container.is-dragging {
      cursor: grabbing !important;
    }

    /* Top HUD Navigation Bar */
    .dome-hud-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7, 8, 10, 0.85) 0%, rgba(7, 8, 10, 0.4) 60%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .dome-hud-header > * {
      pointer-events: auto;
    }

    .dome-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.04em;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dome-back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateX(-2px);
    }

    .dome-header-info {
      text-align: center;
    }

    .dome-header-tag {
      font-family: 'SF Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .dome-header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      margin-top: 2px;
    }

    .dome-hud-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dome-hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      font-family: 'SF Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dome-hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .dome-hud-btn.is-active {
      background: #FFFFFF;
      color: #07080A;
      border-color: #FFFFFF;
    }

    /* Bottom Telemetry & Crosshair HUD */
    .dome-hud-bottom {
      position: absolute;
      bottom: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }

    .dome-telemetry-badge {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(14, 17, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      pointer-events: auto;
    }

    .dome-telemetry-row {
      display: flex;
      gap: 14px;
    }

    .telemetry-val {
      color: #FFFFFF;
      font-weight: 600;
    }

    .dome-hint-box {
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(14, 17, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'SF Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    /* First-Person Center Crosshair / Sight Reticle */
    .dome-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 10;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dome-crosshair::before,
    .dome-crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1px;
    }

    .dome-crosshair::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      transform: translateY(-50%);
    }

    .dome-crosshair::after {
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      transform: translateX(-50%);
    }

    .dome-crosshair-ring {
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .dome-crosshair.is-hovering {
      transform: translate(-50%, -50%) scale(1.6);
    }

    .dome-crosshair.is-hovering .dome-crosshair-ring {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Ambient Dome Vignette */
    .dome-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(5, 6, 8, 0.7) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* ==========================================================================
       Photo Detail Lightbox Modal (Full EXIF & Stories Preserved)
       ========================================================================== */
    .dome-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(4, 5, 7, 0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      padding: 32px;
    }

    .dome-lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .dome-lightbox-card {
      position: relative;
      max-width: 1100px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      background: rgba(15, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dome-lightbox.is-open .dome-lightbox-card {
      transform: translateY(0) scale(1);
    }

    .dome-lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .dome-lightbox-close:hover {
      background: #FFFFFF;
      color: #000000;
    }

    .dome-lightbox-media-wrap {
      width: 100%;
      height: 58vh;
      max-height: 540px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .dome-lightbox-media-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .dome-lightbox-body {
      padding: 24px 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .dome-lightbox-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.5);
    }

    .dome-lightbox-series-badge {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    .dome-lightbox-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin: 0;
    }

    .dome-lightbox-subtitle {
      font-size: 12.5px;
      font-family: 'SF Mono', monospace;
      color: rgba(255, 255, 255, 0.55);
      margin-top: -6px;
    }

    .dome-lightbox-bio {
      font-size: 13.5px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    .dome-lightbox-bio-en {
      font-size: 12.5px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.55);
      font-style: italic;
    }

    @media (max-width: 768px) {
      .dome-hud-header {
        padding: 0 16px;
        height: 60px;
      }
      .dome-header-info {
        display: none;
      }
      .dome-hud-bottom {
        left: 16px;
        right: 16px;
        bottom: 16px;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      .dome-telemetry-badge, .dome-hint-box {
        width: 100%;
        justify-content: center;
      }
      .dome-lightbox {
        padding: 12px;
      }
      .dome-lightbox-media-wrap {
        height: 40vh;
      }
      .dome-lightbox-body {
        padding: 16px;
      }
      .dome-lightbox-title {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Viewport Vignette -->
  <div class="dome-vignette" aria-hidden="true"></div>

  <!-- First-Person Sight Reticle -->
  <div class="dome-crosshair" id="dome-crosshair" aria-hidden="true">
    <div class="dome-crosshair-ring"></div>
  </div>

  <!-- Top Header HUD -->
  <header class="dome-hud-header">
    <a href="index.html#section-work" class="dome-back-btn" title="退出球幕，返回主站摄影板块">
      <span>← BACK // 返回摄影</span>
    </a>

    <div class="dome-header-info">
      <div class="dome-header-tag">// 360° FIRST-PERSON DOME CINEMA</div>

    <div class="dome-hud-tools">

        <span id="view-mode-icon">👁</span>
        <span id="view-mode-text">第一人称球幕</span>
      </button>
      <button type="button" class="dome-hud-btn" id="btn-toggle-auto" title="暂停/开启自动环顾四周">
        <span id="auto-mode-icon">⏸</span>
        <span id="auto-mode-text">自动环顾</span>
      </button>
      <button type="button" class="dome-hud-btn" id="btn-reset-orientation" title="复位水平初始视角">
        <span>↺ 复位</span>
      </button>
    </div>
  </header>

  <!-- Bottom Telemetry HUD -->
  <footer class="dome-hud-bottom">
    <div class="dome-telemetry-badge">
      <div class="dome-telemetry-row">
        <span>YAW (水平): <strong class="telemetry-val" id="telemetry-yaw">0.0°</strong></span>
        <span>PITCH (俯仰): <strong class="telemetry-val" id="telemetry-pitch">0.0°</strong></span>
      </div>
      <div class="dome-telemetry-row">
        <span>FOV 视场角: <strong class="telemetry-val" id="telemetry-fov">65°</strong></span>
        <span>WORKS: <strong class="telemetry-val">12 EXHIBITS</strong></span>
      </div>
    </div>

    <div class="dome-hint-box">
      <span>✥ 按住鼠标拖拽“转头环顾四周” · 滚轮推拉镜头 FOV · 点击作品面板平滑转向并查看详情</span>
    </div>
  </footer>

  <!-- 3D Three.js WebGL Host Container -->
  <div id="dome-canvas-container"></div>

  <!-- Detail Lightbox Modal (100% Preserved Metadata & EXIF) -->
  <div class="dome-lightbox" id="dome-lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="dome-lightbox-card">
      <button type="button" class="dome-lightbox-close" id="dome-lightbox-close" aria-label="关闭预览 (ESC)">✕</button>
      <div class="dome-lightbox-media-wrap">
        <img id="modal-img" src="" alt="Photo Full View">
      </div>
      <div class="dome-lightbox-body">
        <div class="dome-lightbox-top-meta">
          <span class="dome-lightbox-series-badge" id="modal-series">SERIES 01</span>

        <p class="dome-lightbox-subtitle" id="modal-subtitle">KISHO KUROKAWA MEMORIAL HALL</p>
        <p class="dome-lightbox-bio" id="modal-bio"></p>
        <p class="dome-lightbox-bio-en" id="modal-bio-en"></p>
      </div>
    </div>
  </div>

  <script>
    /**
     * ==========================================================================
     * 360° First-Person Spherical Dome Cinema Engine
     * - Camera fixed at (0, 0, 0) spherical origin (True First-Person Look)
     * - Dragging turns camera orientation (Yaw: 360° continuous, Pitch: clamped [-84°, +84°])
     * - Works placed on inner spherical dome surface using Fibonacci Sphere (R = 850)
     * - Every work panel faces origin: lookAt(0, 0, 0)
     * - Raycaster interaction: clicking work smoothly steers camera lookAt and opens detail modal
     * - Mouse wheel / pinch zooms camera FOV (38° to 85°)
     * - Optional Third-Person View Mode pulls camera out to show central figure
     * ==========================================================================
     */

      },
      {
        id: '2',

        subtitle: 'KUSHU DANXIA LANDFORM · GANSU',

    // --- State Variables ---
    let camera, scene, renderer;
    const SPHERE_RADIUS = 850;
    const workMeshes = [];
    let centerPersonMesh = null;
    let domeWireframe = null;

    // First Person Look Euler Angles (in radians)
    let yaw = 0;              // Horizontal look angle
    let pitch = 0;            // Vertical look angle [-1.46, +1.46] (~[-84°, +84°])
    let velYaw = 0;
    let velPitch = 0;
    const FRICTION = 0.92;

    // View Mode: 'first-person' (default) | 'third-person'
    let currentViewMode = 'first-person';

    // Auto Look-Around State
    let isAutoRotating = true;
    let lastUserActionTime = Date.now();
    const AUTO_ROTATE_DELAY_MS = 3200;

    // Drag Interaction
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let dragDistance = 0;

    // Smooth Steer Animation to Clicked Work
    let isSteering = false;
    let steerStartYaw = 0, steerStartPitch = 0;
    let steerTargetYaw = 0, steerTargetPitch = 0;
    let steerProgress = 0;
    let steerTargetItem = null;

    // Raycaster & Crosshair
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let hoveredMesh = null;

    // DOM Elements
    const container = document.getElementById('dome-canvas-container');
    const crosshair = document.getElementById('dome-crosshair');
    const telemetryYaw = document.getElementById('telemetry-yaw');
    const telemetryPitch = document.getElementById('telemetry-pitch');
    const telemetryFov = document.getElementById('telemetry-fov');
    const btnToggleView = document.getElementById('btn-toggle-view');
    const viewModeText = document.getElementById('view-mode-text');
    const btnToggleAuto = document.getElementById('btn-toggle-auto');
    const autoModeIcon = document.getElementById('auto-mode-icon');
    const btnReset = document.getElementById('btn-reset-orientation');

    // Lightbox Elements
    const lightbox = document.getElementById('dome-lightbox');
    const lightboxClose = document.getElementById('dome-lightbox-close');
    const modalImg = document.getElementById('modal-img');
    const modalSeries = document.getElementById('modal-series');
    const modalLocation = document.getElementById('modal-location');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalBio = document.getElementById('modal-bio');
    const modalBioEn = document.getElementById('modal-bio-en');

    // --- 1. Fibonacci Sphere Point Distribution ---
    function getFibonacciSpherePoints(samples, radius) {
      const points = [];
      const phi = Math.PI * (Math.sqrt(5) - 1); // golden ratio angle
      for (let i = 0; i < samples; i++) {
        const y = 1 - (i / (samples - 1)) * 2; // y: 1 to -1
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = phi * i;
        const x = Math.cos(theta) * radiusAtY * radius;
        const z = Math.sin(theta) * radiusAtY * radius;
        points.push({ x, y: y * radius, z });
      }
      return points;
    }

    // --- 2. Canvas Card Texture Generator (Fallback & Native Frame) ---
    function createCardTexture(item) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');

      // Dark card base
      ctx.fillStyle = '#0D0F14';
      ctx.fillRect(0, 0, 512, 360);

      // Loading fallback text while img loads
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.title, 256, 170);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '16px monospace';
      ctx.fillText(item.series + ' // ' + item.location, 256, 210);

      const texture = new THREE.CanvasTexture(canvas);

      // Asynchronously load real image
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        ctx.clearRect(0, 0, 512, 360);

        // Draw image cover
        const aspectImg = img.width / img.height;
        const aspectCanvas = 512 / 360;
        let sW, sH, sX, sY;
        if (aspectImg > aspectCanvas) {
          sH = img.height;
          sW = img.height * aspectCanvas;
          sX = (img.width - sW) / 2;
          sY = 0;
        } else {
          sW = img.width;
          sH = img.width / aspectCanvas;
          sX = 0;
          sY = (img.height - sH) / 2;
        }
        ctx.drawImage(img, sX, sY, sW, sH, 0, 0, 512, 360);

        // Elegant Gradient Vignette on panel
        const grad = ctx.createLinearGradient(0, 0, 0, 360);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
        grad.addColorStop(0.35, 'rgba(0, 0, 0, 0.0)');
        grad.addColorStop(0.65, 'rgba(0, 0, 0, 0.2)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.85)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 360);

        // Luminous Glass Border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, 508, 356);

        // Top Series Badge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(16, 16, 110, 28);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(item.series, 24, 35);

        // Bottom Title & Meta
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 22px Inter, sans-serif';
        ctx.fillText(item.title, 20, 310);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = '13px monospace';
        ctx.fillText(item.location, 20, 335);

        texture.needsUpdate = true;
      };
      img.src = item.src;

      return texture;
    }

    // --- 3. Initialize Three.js Scene ---
    function initThreeScene() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060709);
      scene.fog = new THREE.FogExp2(0x060709, 0.00045);

      camera = new THREE.PerspectiveCamera(65, width / height, 1, 3500);
      camera.position.set(0, 0, 0); // Strictly fixed at spherical center for first-person

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Ambient Celestial Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      // Subtle Dome Wireframe Grid (Deep Space Atmosphere)
      const domeGeo = new THREE.SphereGeometry(SPHERE_RADIUS + 30, 32, 24);
      const domeMat = new THREE.MeshBasicMaterial({
        color: 0x1f242d,
        wireframe: true,
        transparent: true,
        opacity: 0.12
      });
      domeWireframe = new THREE.Mesh(domeGeo, domeMat);
      scene.add(domeWireframe);

      // Create Works on Inner Sphere Surface (Fibonacci Distribution)
      const points = getFibonacciSpherePoints(PHOTO_DATA.length, SPHERE_RADIUS);

      PHOTO_DATA.forEach((item, index) => {
        const pt = points[index];
        const texture = createCardTexture(item);

        // Curved / Flat Panel oriented towards center
        const planeGeo = new THREE.PlaneGeometry(260, 182, 1, 1);
        const planeMat = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(planeGeo, planeMat);
        mesh.position.set(pt.x, pt.y, pt.z);

        // Crucial: Every panel on the spherical inner wall faces the center origin (0, 0, 0)
        mesh.lookAt(0, 0, 0);

        // Save reference data
        mesh.userData = { item: item, baseScale: 1.0, isHovered: false };
        scene.add(mesh);
        workMeshes.push(mesh);
      });

      // Optional: Central Figure (Hidden in First-Person, Visible in Third-Person)
      const personTexture = new THREE.TextureLoader().load('Project pictures/home page人物.png');
      const personGeo = new THREE.PlaneGeometry(240, 320);
      const personMat = new THREE.MeshBasicMaterial({
        map: personTexture,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide
      });
      centerPersonMesh = new THREE.Mesh(personGeo, personMat);
      centerPersonMesh.position.set(0, -50, 0);
      centerPersonMesh.visible = false; // Hidden in First-Person Mode
      scene.add(centerPersonMesh);
    }

    // --- 4. User Drag & Look-Around Controller ---
    function setupInteraction() {
      // Pointer down
      container.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        isDragging = true;
        dragDistance = 0;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
        velYaw = 0;
        velPitch = 0;
        isSteering = false; // Cancel any ongoing steer
        isAutoRotating = false;
        lastUserActionTime = Date.now();
        container.classList.add('is-dragging');
        try { container.setPointerCapture(e.pointerId); } catch (_) {}
      });

      // Pointer move
      window.addEventListener('pointermove', (e) => {
        // Update Normalized Device Coordinates for Raycaster
        mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

        if (!isDragging) return;

        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
        dragDistance += Math.hypot(dx, dy);

        // Turn Camera (First-Person look around)
        // Horizontal look (Yaw): positive dx looks left/right
        yaw -= dx * 0.0035;

        // Vertical look (Pitch): clamped to avoid tumbling over zenith/nadir
        pitch = Math.max(-1.46, Math.min(1.46, pitch + dy * 0.0035));

        // Store instantaneous velocity for inertia glide
        velYaw = -dx * 0.0032;
        velPitch = dy * 0.0032;

        lastUserActionTime = Date.now();
      });

      function stopDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        container.classList.remove('is-dragging');
        try { if (e && e.pointerId) container.releasePointerCapture(e.pointerId); } catch (_) {}
        lastUserActionTime = Date.now();
      }

      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);

      // Click on Work Panel Detection via Raycaster
      container.addEventListener('click', (e) => {
        // If dragged more than 6px, treat as look rotation, not click
        if (dragDistance > 6) return;

        raycaster.setFromCamera(mouseNDC, camera);
        const intersects = raycaster.intersectObjects(workMeshes);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          steerCameraToWork(hit.userData.item, hit.position);
        }
      });

      // Mouse Wheel Zoom (Adjust Camera FOV)
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const fovDelta = e.deltaY * 0.04;
        camera.fov = Math.max(38, Math.min(85, camera.fov + fovDelta));
        camera.updateProjectionMatrix();
        telemetryFov.textContent = Math.round(camera.fov) + '°';
        lastUserActionTime = Date.now();
      }, { passive: false });

      // Mobile Touch Pinch Zoom
      let initialDist = 0;
      let initialFov = 65;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialFov = camera.fov;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialDist > 0) {
          const currDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const ratio = initialDist / currDist;
          camera.fov = Math.max(38, Math.min(85, initialFov * ratio));
          camera.updateProjectionMatrix();
          telemetryFov.textContent = Math.round(camera.fov) + '°';
        }
      }, { passive: true });

      // View Mode Toggle (First-Person vs Third-Person)
      btnToggleView.addEventListener('click', () => {
        if (currentViewMode === 'first-person') {
          currentViewMode = 'third-person';
          viewModeText.textContent = '第三人称视点';
          btnToggleView.classList.add('is-active');
          if (centerPersonMesh) centerPersonMesh.visible = true;
          camera.position.set(0, 160, 960);
          camera.lookAt(0, 0, 0);
        } else {
          currentViewMode = 'first-person';
          viewModeText.textContent = '第一人称球幕';
          btnToggleView.classList.remove('is-active');
          if (centerPersonMesh) centerPersonMesh.visible = false;
          camera.position.set(0, 0, 0); // Back to sphere origin
        }
      });

      // Auto-rotation toggle
      btnToggleAuto.addEventListener('click', () => {
        isAutoRotating = !isAutoRotating;
        autoModeIcon.textContent = isAutoRotating ? '⏸' : '▶';
        btnToggleAuto.classList.toggle('is-active', isAutoRotating);
      });

      // Reset orientation button
      btnReset.addEventListener('click', () => {
        yaw = 0;
        pitch = 0;
        velYaw = 0;
        velPitch = 0;
        camera.fov = 65;
        camera.updateProjectionMatrix();
        telemetryFov.textContent = '65°';
      });

      // Keyboard Controls (Esc to close lightbox)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeLightbox();
        }
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      window.addEventListener('resize', onWindowResize);
    }

    // --- 5. Smooth Steer Camera to Work & Open Lightbox ---
    function steerCameraToWork(item, workPos) {
      isSteering = true;
      steerProgress = 0;
      steerTargetItem = item;

      steerStartYaw = yaw;
      steerStartPitch = pitch;

      // Compute exact Yaw and Pitch from (0,0,0) to target point
      // In Three.js: target direction vector D = (workPos.x, workPos.y, workPos.z)
      const r = Math.hypot(workPos.x, workPos.y, workPos.z);
      steerTargetPitch = Math.asin(workPos.y / r);
      steerTargetYaw = Math.atan2(workPos.x, -workPos.z);

      // Normalize delta yaw to shortest path
      let deltaYaw = (steerTargetYaw - steerStartYaw) % (Math.PI * 2);
      if (deltaYaw > Math.PI) deltaYaw -= Math.PI * 2;
      if (deltaYaw < -Math.PI) deltaYaw += Math.PI * 2;
      steerTargetYaw = steerStartYaw + deltaYaw;
    }

    window.openLightbox = openLightbox;
    window.closeLightbox = closeLightbox;
    window.PHOTO_DATA = PHOTO_DATA;

    function openLightbox(item) {
      modalImg.src = item.src;
      modalSeries.textContent = item.series;
      modalLocation.textContent = item.location;
      modalTitle.textContent = item.title;
      modalSubtitle.textContent = item.subtitle;
      modalBio.textContent = item.bio;
      modalBioEn.textContent = item.bioEn;

      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      modalImg.src = '';
    }

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // --- 6. Main 60/120 FPS Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Handle Smooth Steer to Clicked Work
      if (isSteering) {
        steerProgress += 0.045;
        const t = Math.min(1, steerProgress);
        // Ease-out cubic
        const ease = 1 - Math.pow(1 - t, 3);
        yaw = steerStartYaw + (steerTargetYaw - steerStartYaw) * ease;
        pitch = steerStartPitch + (steerTargetPitch - steerStartPitch) * ease;

        if (t >= 1) {
          isSteering = false;
          openLightbox(steerTargetItem);
        }
      } else {
        // Inertia or Auto Look-Around
        if (!isDragging) {
          if (Math.abs(velYaw) > 0.0001 || Math.abs(velPitch) > 0.0001) {
            yaw += velYaw;
            pitch = Math.max(-1.46, Math.min(1.46, pitch + velPitch));
            velYaw *= FRICTION;
            velPitch *= FRICTION;
          } else if (isAutoRotating) {
            const timeSinceAction = Date.now() - lastUserActionTime;
            if (timeSinceAction > AUTO_ROTATE_DELAY_MS) {
              yaw += 0.0012; // Slow contemplative ambient look-around
            }
          }
        }
      }

      // Update First-Person Camera Orientation (From Sphere Origin)
      if (currentViewMode === 'first-person') {
        camera.position.set(0, 0, 0);

        // Convert Yaw & Pitch to LookAt Target Point on sphere
        const cosPitch = Math.cos(pitch);
        const lookX = Math.sin(yaw) * cosPitch;
        const lookY = Math.sin(pitch);
        const lookZ = -Math.cos(yaw) * cosPitch;

        const targetPos = new THREE.Vector3(lookX, lookY, lookZ);
        camera.lookAt(targetPos);
      } else {
        // Third-Person Mode: Orbit around center person
        const orbitRadius = 960;
        camera.position.x = Math.sin(yaw) * orbitRadius * Math.cos(pitch);
        camera.position.y = Math.sin(pitch) * orbitRadius + 60;
        camera.position.z = Math.cos(yaw) * orbitRadius * Math.cos(pitch);
        camera.lookAt(0, 0, 0);
      }

      // Raycasting for Crosshair Reticle & Hover States
      if (!isDragging && !lightbox.classList.contains('is-open')) {
        raycaster.setFromCamera(mouseNDC, camera);
        const intersects = raycaster.intersectObjects(workMeshes);

        if (intersects.length > 0) {
          crosshair.classList.add('is-hovering');
          const hit = intersects[0].object;
          if (hoveredMesh !== hit) {
            if (hoveredMesh) hoveredMesh.scale.set(1, 1, 1);
            hoveredMesh = hit;
            hoveredMesh.scale.set(1.05, 1.05, 1.05);
          }
        } else {
          crosshair.classList.remove('is-hovering');
          if (hoveredMesh) {
            hoveredMesh.scale.set(1, 1, 1);
            hoveredMesh = null;
          }
        }
      }

      // Update Telemetry Display
      const degYaw = (((yaw * 180 / Math.PI) % 360 + 360) % 360).toFixed(1);
      const degPitch = (pitch * 180 / Math.PI).toFixed(1);
      telemetryYaw.textContent = `${degYaw}°`;
      telemetryPitch.textContent = `${degPitch}°`;

      // Render Scene
      renderer.render(scene, camera);
    }

    // --- Boot ---
    window.addEventListener('DOMContentLoaded', () => {
      initThreeScene();
      setupInteraction();
      animate();
    });
  </script>
</body>
</html>
